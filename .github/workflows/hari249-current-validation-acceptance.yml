name: Hari2.4.9 pinned current Khronos validation native acceptance
"on":
  push:
    branches: [async-1.20.1-ultimate-2.4.0-vulkan-hybrid-20260926]
    paths: ['.github/workflows/hari249-current-validation-acceptance.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: hari249-current-validation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native-modpack:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 13
      matrix:
        lane: [midnight, dimensions-c2me]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install QA tools and Khronos validation layer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl tar unzip mesa-vulkan-drivers vulkan-tools vulkan-validationlayers xvfb openbox xdotool x11-utils imagemagick libgl1-mesa-dri mesa-utils libflite1
          mkdir -p production-qa qa-native-libs
          flite_lib="$(ldconfig -p | awk '/libflite\.so\.1/{print $NF; exit}')"
          test -n "$flite_lib"
          ln -sf "$flite_lib" qa-native-libs/libflite.so
          echo "LD_LIBRARY_PATH=$PWD/qa-native-libs${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
      - name: Install checksum-pinned current Khronos validation library
        run: python3 .github/qa/hari249_install_validation_sdk.py
      - name: Download immutable packaged-client candidate
        uses: actions/download-artifact@v4
        with:
          name: HariMultiThread-Ultimate-1.20.1-2.4.0-VULKAN-HYBRID-COMPILE
          run-id: 37163922566
          github-token: ${{ github.token }}
          path: tested
      - name: Verify artifact and C2ME bytes
        shell: bash
        run: |
          set -euo pipefail
          echo 'c1082c8282ff40221c0ea982ce329ec6ab9a26c80790d643d1277b412b8fb396  tested/HariMultiThread-Ultimate-1.20.1-2.4.9-vulkan-hybrid.jar' | sha256sum -c -
          sha256sum tested/HariMultiThread-Ultimate-1.20.1-2.4.9-vulkan-hybrid.jar | sed 's#tested/#production-qa/#' > tested/JAR-SHA256.txt
          curl -fL --retry 3 'https://edge.forgecdn.net/files/8929/972/c2meforge-0.2.0-forge.9.6-all.jar' -o c2meforge-0.2.0-forge.9.6-all.jar
          echo '97401e625906dc7dbe7719c4915d5aa88830e64e5aa6f90831ee45a61373f8d3  c2meforge-0.2.0-forge.9.6-all.jar' | sha256sum -c -
      - name: Generate deterministic Forge world fixture
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 3 \
            'https://maven.minecraftforge.net/net/minecraftforge/forge/1.20.1-47.4.23/forge-1.20.1-47.4.23-installer.jar' \
            -o forge-installer.jar
          rm -rf production-seed-server
          mkdir production-seed-server
          (cd production-seed-server && java -jar ../forge-installer.jar --installServer > ../production-qa/forge-server-install.log 2>&1)
          chmod +x production-seed-server/run.sh
          printf 'eula=true\n' > production-seed-server/eula.txt
          cat > production-seed-server/server.properties <<'EOF'
          online-mode=false
          level-name=world
          level-seed=8675309
          spawn-protection=0
          view-distance=8
          simulation-distance=8
          motd=Hari 2.4 Production Client World Seed
          EOF
          python3 .github/qa/hari_seed_c2me_world.py production-seed-server production-qa/seed-server.log
          test -s production-seed-server/world/level.dat

      - name: Install pinned PortableMC production launcher
        shell: bash
        run: |
          set -euo pipefail
          url='https://github.com/theorzr/portablemc/releases/download/v5.0.5/portablemc-5.0.5-linux-x86_64-gnu.tar.gz'
          curl -fL --retry 3 "$url" -o portablemc.tar.gz
          echo '272611ab554237993cd2720dcc7219516f5e9d6382986df2c6d7177793b145dc  portablemc.tar.gz' | sha256sum -c -
          rm -rf portablemc-bin
          mkdir portablemc-bin
          tar -xzf portablemc.tar.gz -C portablemc-bin
          pmc="$(find portablemc-bin -type f -name portablemc -perm -u+x | head -n 1)"
          test -n "$pmc"
          "$pmc" --version | tee production-qa/portablemc-version.txt
          echo "$pmc" > production-qa/portablemc-path.txt

      - name: Install exact Forge production profile
        shell: bash
        run: |
          set -euo pipefail
          pmc="$(cat production-qa/portablemc-path.txt)"
          rm -rf pmc-main pmc-game
          mkdir -p pmc-main pmc-game
          "$pmc" --main-dir "$PWD/pmc-main" -vv start forge::1.20.1-47.4.23 \
            --mc-dir "$PWD/pmc-game" --jvm "$JAVA_HOME/bin/java" \
            -u HariProdQA --resolution 1280x720 --dry \
            | tee production-qa/portablemc-install.log

          grep -R -F '"forgeclient"' pmc-main/versions pmc-game 2>/dev/null | tee production-qa/forgeclient-profile-proof.txt
          if grep -R -F 'forgeclientuserdev' pmc-main/versions pmc-game 2>/dev/null; then
            echo '::error::Production launcher installation contains forgeclientuserdev'
            exit 1
          fi

          mkdir -p pmc-game/mods pmc-game/saves/HMT-2.4-QA
          cp tested/HariMultiThread-Ultimate-1.20.1-2.4.9-vulkan-hybrid.jar pmc-game/mods/HariMultiThread-Ultimate.jar
          cp -a production-seed-server/world/. pmc-game/saves/HMT-2.4-QA/
          printf 'renderDistance:4\nsimulationDistance:5\nmaxFps:260\nenableVsync:false\npauseOnLostFocus:false\n' > pmc-game/options.txt
          # The software driver supports core GL 4.5. Avoid spending Forge's
          # ten-second early-window budget attempting unsupported GL 4.6.
          mkdir -p pmc-game/config
          printf 'earlyWindowSkipGLVersions = ["4.6"]\n' > pmc-game/config/fml.toml
          sha256sum pmc-game/mods/HariMultiThread-Ultimate.jar | tee production-qa/INSTALLED-JAR-SHA256.txt
          diff -u tested/JAR-SHA256.txt <(sed 's#pmc-game/mods/HariMultiThread-Ultimate.jar#production-qa/HariMultiThread-Ultimate-1.20.1-2.4.9-vulkan-hybrid.jar#' production-qa/INSTALLED-JAR-SHA256.txt)

      - name: Install immutable complete mod dependency closure
        env:
          HARI_LANE: ${{ matrix.lane }}
        run: |
          python3 .github/qa/hari24_modpack_inputs.py --lane "$HARI_LANE" \
            --lock .github/qa/hari24-mod-input-lock.json --game pmc-game --cache compat-mod-cache \
            --candidate tested/HariMultiThread-Ultimate-1.20.1-2.4.9-vulkan-hybrid.jar --evidence production-qa
          python3 .github/qa/hari24_binary_gate_probe.py \
            pmc-game/mods/HariMultiThread-Ultimate.jar pmc-game --java "$JAVA_HOME/bin/java" \
            --report production-qa/installed-renderer-selection.json
      - name: Native portals mobs chunk unload reload and second JVM reopen
        run: |
          set -euo pipefail
          pmc="$(cat production-qa/portablemc-path.txt)"
          renderer="$(python3 -c 'import json; print(json.load(open("production-qa/installed-renderer-selection.json"))["expected_renderer"])')"
          extra=()
          if [ "${{ matrix.lane }}" = "oculus-shaders" ]; then extra+=(--shaderpack MakeUp-UltraFast-9.5f.zip); fi
          python3 .github/qa/hari249_current_validation_qa.py "${extra[@]}" \
            --portablemc "$pmc" --main-dir pmc-main --mc-dir pmc-game --world HMT-2.4-QA \
            --evidence production-qa/client-first --java "$JAVA_HOME/bin/java" --expect "$renderer" --display :91
          python3 .github/qa/hari249_current_validation_qa.py "${extra[@]}" \
            --portablemc "$pmc" --main-dir pmc-main --mc-dir pmc-game --world HMT-2.4-QA \
            --evidence production-qa/client-reopen --java "$JAVA_HOME/bin/java" --expect "$renderer" --display :91 --reopen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hari-2.4.9-CURRENT-VALIDATION-MODPACK-${{ matrix.lane }}
          path: production-qa/
          if-no-files-found: error

# Grabbed native cursor uses queued X11 motion; player-state observations synchronize input.
