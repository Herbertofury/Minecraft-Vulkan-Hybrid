name: Standalone source build and focused regressions
on:
  push:
    branches: ['migration/**']
    paths: ['integration/**', 'compat/**', 'source/**', 'tools/**', 'provenance/**', 'minecraft/**', '.github/workflows/build.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify all 1001 source files
        run: python tools/verify_source.py
      - name: Build complete merged source
        working-directory: source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=4 :forge:build --stacktrace
      - name: Assemble and build the integrated dimension scheduler
        run: |
          python integration/dimensions/assemble.py ../hari-integrated-ci
          ./source/gradlew -p ../hari-integrated-ci :forge:build --no-daemon --max-workers=4
      - name: Verify dimension ownership, failures and queue boundaries
        run: |
          mkdir -p qa-out/dimensions
          javac -cp ../hari-integrated-ci/forge/build/classes/java/main -d qa-out/dimensions integration/dimensions/overlay/forge/src/main/java/me/srrapero720/dimthread/ParallelThreadSwap.java integration/dimensions/vendor/dimthreads/src/main/java/me/srrapero720/dimthread/thread/IMutableMainThread.java integration/dimensions/overlay/forge/src/main/java/me/srrapero720/dimthread/thread/ThreadPool.java integration/dimensions/tests/OwnershipRegression.java
          java -ea -cp qa-out/dimensions OwnershipRegression
          python integration/dimensions/tests/test_waiter.py ../hari-integrated-ci --report qa-out/dimension-waiter.json
          python integration/dimensions/tests/test_mts_removal.py --report qa-out/mts-removal.json
      - name: Build optional OpenGL texture compatibility mod
        run: ./source/gradlew -p compat/opengl-texture-lookup build --no-daemon --max-workers=4
      - name: Verify texture lookup ownership and original failure propagation
        run: |
          mkdir -p qa-out/texture-lookup
          javac -d qa-out/texture-lookup compat/opengl-texture-lookup/src/main/java/mvhglcompat/TextureLookup.java compat/opengl-texture-lookup/tests/TextureLookupRegression.java
          java -cp qa-out/texture-lookup TextureLookupRegression
      - name: Build optional Field Guide startup compatibility mod
        run: ./source/gradlew -p compat/fieldguide-query-split build --no-daemon --max-workers=4
      - name: Verify exact biome parsing parity and bounded ownership
        run: |
          mkdir -p qa-out/fieldguide-split
          javac -encoding UTF-8 -d qa-out/fieldguide-split compat/fieldguide-query-split/src/main/java/mvhstartupcompat/BiomeQuerySplitCache.java compat/fieldguide-query-split/tests/BiomeQuerySplitRegression.java
          java -cp qa-out/fieldguide-split BiomeQuerySplitRegression
          javac -encoding UTF-8 -cp qa-out/fieldguide-split -d qa-out/fieldguide-split compat/fieldguide-query-split/src/main/java/mvhstartupcompat/BiomeModifierIndex.java compat/fieldguide-query-split/tests/BiomeModifierIndexRegression.java
          java -ea -cp qa-out/fieldguide-split BiomeModifierIndexRegression
      - name: Build optional exact grass distance compatibility mod
        run: ./source/gradlew -p compat/grass-distance-sort build --no-daemon --max-workers=4
      - name: Verify exact stable grass section ordering and bounded scratch
        run: |
          mkdir -p qa-out/grass-distance
          javac -encoding UTF-8 -d qa-out/grass-distance compat/grass-distance-sort/src/main/java/mvhgrasscompat/DistanceSort.java compat/grass-distance-sort/tests/DistanceSortRegression.java
          java -ea -cp qa-out/grass-distance DistanceSortRegression
      - name: Build isolated native benchmark recorder
        run: ./source/gradlew -p benchmarks/control-forge build --no-daemon --max-workers=4
      - name: Verify packaged Minecraft resource metadata
        run: python tools/verify_pack_metadata.py 'source/forge/build/libs/*-all.jar' '../hari-integrated-ci/forge/build/libs/*-all.jar' 'compat/opengl-texture-lookup/build/libs/*.jar' 'compat/fieldguide-query-split/build/libs/*.jar' 'benchmarks/control-forge/build/libs/*.jar' 'compat/grass-distance-sort/build/libs/*.jar'
      - name: Run portable production regressions
        run: |
          set -euo pipefail
          mkdir -p qa-out
          for suite in vulkan_performance chunk_workers audio_reload gl_contract gl_shader_source c2me_boundary c2me_spawn_lock c2me_task_waiter c2me_chunk_access; do
            python minecraft/async-1.20.1-ultimate/test_${suite}.py source --report qa-out/${suite}.json
          done
          python minecraft/async-1.20.1-ultimate/test_task_failures.py source/common/src/main/java/com/axalotl/async/common/TaskFailures.java --report qa-out/task_failures.json
      - name: Collect integrated artifact inside the workspace
        run: |
          mkdir -p qa-out/artifacts
          cp ../hari-integrated-ci/forge/build/libs/*-all.jar qa-out/artifacts/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-build-and-focused-proof
          path: |
            source/forge/build/libs/*-all.jar
            compat/opengl-texture-lookup/build/libs/*.jar
            compat/fieldguide-query-split/build/libs/*.jar
            benchmarks/control-forge/build/libs/*.jar
            compat/grass-distance-sort/build/libs/*.jar
            qa-out/
            LICENSE
