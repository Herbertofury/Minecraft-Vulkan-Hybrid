name: Hari 2.4.9 exact native evidence checkpoint
"on":
  push:
    branches: [async-1.20.1-ultimate-2.4.0-vulkan-hybrid-20260926]
    paths: ['.github/workflows/hari249-native-evidence-checkpoint.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify immutable native results and preserve complete proof
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/qa/hari249_native_evidence_checkpoint.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Hari-2.4.9-exact-standard-native-evidence
          path: native-checkpoint/
          if-no-files-found: error
