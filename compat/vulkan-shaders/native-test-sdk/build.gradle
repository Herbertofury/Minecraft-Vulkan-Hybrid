plugins { id 'base' }
repositories { mavenCentral() }
configurations { referenceCompiler; legacyCompiler }
def nativePlatform=System.getProperty('os.name').toLowerCase().contains('windows')?'windows':'linux'
dependencies {
    referenceCompiler 'org.lwjgl:lwjgl:3.3.6'
    referenceCompiler 'org.lwjgl:lwjgl-vulkan:3.3.6'
    referenceCompiler 'org.lwjgl:lwjgl-shaderc:3.3.6'
    referenceCompiler "org.lwjgl:lwjgl:3.3.6:natives-${nativePlatform}"
    referenceCompiler "org.lwjgl:lwjgl-shaderc:3.3.6:natives-${nativePlatform}"
    legacyCompiler 'org.lwjgl:lwjgl:3.3.1'
    legacyCompiler 'org.lwjgl:lwjgl-vulkan:3.3.1'
    legacyCompiler 'org.lwjgl:lwjgl-shaderc:3.3.3'
}
tasks.register('writeTestClasspaths') {
    outputs.files(layout.buildDirectory.file('reference-classpath.txt'),layout.buildDirectory.file('legacy-classpath.txt'))
    doLast {
        layout.buildDirectory.get().asFile.mkdirs()
        layout.buildDirectory.file('reference-classpath.txt').get().asFile.text=configurations.referenceCompiler.asPath
        layout.buildDirectory.file('legacy-classpath.txt').get().asFile.text=configurations.legacyCompiler.asPath
    }
}
