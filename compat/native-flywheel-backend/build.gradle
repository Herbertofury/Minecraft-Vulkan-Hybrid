plugins { id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'; id 'java' }
version='0.1.0-native-engine';group='mvhflywheelbackend';base { archivesName='mvh-flywheel-native-backend' }
java.toolchain.languageVersion=JavaLanguageVersion.of(17)
minecraft { mappings channel:'official',version:'1.20.1' }
repositories { mavenCentral() }
dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.4.26'
    compileOnly 'org.lwjgl:lwjgl-vulkan:3.3.1'
    compileOnly 'org.lwjgl:lwjgl-shaderc:3.3.1'
    compileOnly files(findProperty('mvhHariReference'))
    compileOnly files(findProperty('mvhFlywheelReference'))
}
jar.finalizedBy('reobfJar')
tasks.withType(AbstractArchiveTask).configureEach { preserveFileTimestamps=false; reproducibleFileOrder=true }
tasks.withType(JavaCompile).configureEach { options.encoding='UTF-8' }
